# Render Infrastructure as Code Blueprint
# Secure File Exchange with Cryptographic Ephemeral Access Control
version: "1"

services:
  # 1. Django REST Backend API (Free Tier Web Service)
  - type: web
    name: secure-file-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: secure-file-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://secure-file-frontend-ufd1.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://secure-file-frontend-ufd1.onrender.com"
      - key: FRONTEND_URL
        value: "https://secure-file-frontend-ufd1.onrender.com"
      - key: CLAMAV_ENABLED
        value: "False"

  # 2. React Vite Frontend Single-Page Application (Global CDN Static Site)
  - type: web
    name: secure-file-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://secure-file-backend-mciu.onrender.com/api"

databases:
  # Managed PostgreSQL Database (Free Tier)
  - name: secure-file-db
    databaseName: secure_file_portal
    user: portal_admin
    plan: free
    region: oregon
