# Render Infrastructure as Code Blueprint
# Secure File Exchange with Cryptographic Ephemeral Access Control
version: "1"

services:
  # 1. Django REST Backend API
  - type: web
    name: secure-file-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT"
    disk:
      name: encrypted-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: DATABASE_URL
        fromDatabase:
          name: secure-file-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Set to your frontend URL (e.g. https://secure-file-frontend.onrender.com)
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # Set to your frontend URL (e.g. https://secure-file-frontend.onrender.com)
      - key: FRONTEND_URL
        sync: false # Set to your frontend URL
      - key: CLAMAV_ENABLED
        value: "False"

  # 2. React Vite Frontend Single-Page Application
  - type: web
    name: secure-file-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: secure-file-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: secure-file-db
    databaseName: secure_file_portal
    user: portal_admin
    plan: free
    region: oregon
